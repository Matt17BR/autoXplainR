on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 4 * * 1'

name: H2O-integration

permissions:
  contents: read

jobs:
  h2o:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      AUTOXPLAIN_RUN_H2O: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgload, any::remotes, any::testthat, any::h2o, any::bit64
      - name: Install the exact CRAN H2O minimum in an isolated library
        run: >-
          Rscript .github/scripts/check-engine-support.R
          --engines=h2o --install
          --library="$RUNNER_TEMP/h2o-minimum-library"
          --report="$RUNNER_TEMP/h2o-support-install"
      - name: Verify the H2O pin and run live integration tests
        run: >-
          Rscript .github/scripts/check-engine-support.R
          --engines=h2o --live-h2o
          --library="$RUNNER_TEMP/h2o-minimum-library"
          --report="$RUNNER_TEMP/h2o-support-tests"
      - name: Upload H2O package and runtime provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AutoXplainR-H2O-minimum-support-${{ github.sha }}
          path: |
            ${{ runner.temp }}/h2o-support-install/
            ${{ runner.temp }}/h2o-support-tests/
          if-no-files-found: warn
