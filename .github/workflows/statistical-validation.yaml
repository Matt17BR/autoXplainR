name: statistical-validation
on:
  push:
    branches: [main]
    paths:
      - 'R/**'
      - 'src/**'
      - 'inst/**'
      - 'data/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.Rprofile'
      - 'validation/check-tuning-mutation.R'
      - 'validation/run-reference.R'
      - 'validation/run-simulation.R'
      - 'validation/competitive-tabular/download.py'
      - 'validation/competitive-tabular/test-download-sources.py'
      - 'validation/competitive-tabular/prepare.R'
      - 'validation/competitive-tabular/common.R'
      - 'validation/competitive-tabular/test-prepare-consumed-sources.R'
      - 'validation/competitive-tabular/collect.py'
      - 'validation/competitive-tabular/public_results_sanitizer.py'
      - 'validation/competitive-tabular/test-public-results-sanitizer.py'
      - 'validation/competitive-tabular/native-training-results.json'
      - '.github/workflows/statistical-validation.yaml'
  pull_request:
    paths:
      - 'R/**'
      - 'src/**'
      - 'inst/**'
      - 'data/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.Rprofile'
      - 'validation/check-tuning-mutation.R'
      - 'validation/run-reference.R'
      - 'validation/run-simulation.R'
      - 'validation/competitive-tabular/download.py'
      - 'validation/competitive-tabular/test-download-sources.py'
      - 'validation/competitive-tabular/prepare.R'
      - 'validation/competitive-tabular/common.R'
      - 'validation/competitive-tabular/test-prepare-consumed-sources.R'
      - 'validation/competitive-tabular/collect.py'
      - 'validation/competitive-tabular/public_results_sanitizer.py'
      - 'validation/competitive-tabular/test-public-results-sanitizer.py'
      - 'validation/competitive-tabular/native-training-results.json'
      - '.github/workflows/statistical-validation.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: statistical-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  numerical-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgload, any::iml, any::testthat, any::data.table
      - name: Verify benchmark source and publication guards
        run: |
          python3 -B validation/competitive-tabular/test-download-sources.py
          Rscript --vanilla validation/competitive-tabular/test-prepare-consumed-sources.R
          python3 -B validation/competitive-tabular/test-public-results-sanitizer.py
          python3 -B validation/competitive-tabular/test-public-results-sanitizer.py --integration-gate
      - name: Compare numerical output and record coverage simulation
        run: |
          Rscript validation/check-tuning-mutation.R
          Rscript validation/run-reference.R
          Rscript validation/run-simulation.R
      - uses: actions/upload-artifact@v7
        with:
          name: statistical-evidence-${{ github.sha }}
          path: validation/results/
          if-no-files-found: error
