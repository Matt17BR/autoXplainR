name: statistical-validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgload, any::iml
      - name: Compare numerical output and record coverage simulation
        run: |
          Rscript validation/check-tuning-mutation.R
          Rscript validation/run-reference.R
          Rscript validation/run-simulation.R
      - uses: actions/upload-artifact@v7
        with:
          name: statistical-evidence-${{ github.sha }}
          path: validation/results/
          if-no-files-found: error
