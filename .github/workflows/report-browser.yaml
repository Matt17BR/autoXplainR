on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

name: report-browser

permissions:
  contents: read

jobs:
  generated-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      AUTOXPLAIN_RUN_H2O: false
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgload
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned browser and accessibility tools
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/report-browser-tools" --no-audit --no-fund axe-core@4.13.0
          sudo apt-get install --yes poppler-utils
      - name: Generate the actual synthetic report
        run: Rscript validation/render-example.R
      - name: Check mobile, keyboard, WCAG and printed report contracts
        run: >-
          python validation/check-report-browser.py pkgdown/assets/model-report.html
          --output-dir "$RUNNER_TEMP/report-browser-results"
          --axe-path "$RUNNER_TEMP/report-browser-tools/node_modules/axe-core/axe.min.js"
      - name: Upload compact browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AutoXplainR-report-browser-${{ github.sha }}
          path: ${{ runner.temp }}/report-browser-results/
          if-no-files-found: warn
          retention-days: 7
