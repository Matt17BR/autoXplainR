on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

name: report-browser

permissions:
  contents: read

jobs:
  generated-report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      AUTOXPLAIN_RUN_H2O: false
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgload
            any::jsonlite
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned browser and accessibility tools
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/report-browser-tools" --no-audit --no-fund axe-core@4.13.0
          sudo apt-get install --yes poppler-utils
      - name: Verify committed gallery before regenerating any reports
        run: >-
          python validation/check-gallery.py --browser
          --output-dir "$RUNNER_TEMP/report-browser-results/gallery"
      - name: Generate regression and classification reports with R answer data
        run: Rscript validation/render-explorer-cases.R
      - name: Generate raw and processed data exploration cases
        run: Rscript validation/render-exploration-fixtures.R
      - name: Generate reports from existing fitted models
        run: Rscript validation/render-supplied-models.R
      - name: Generate hand-calculated selection evidence
        run: Rscript validation/render-selection-fixture.R
      - name: Generate exact decimal cutoff evidence
        run: Rscript validation/render-cutoff-fixture.R
      - name: Generate linked classification cases at literal cutoffs
        run: Rscript validation/render-cutoff-cases.R
      - name: Exercise model exploration, mobile, keyboard and print tasks
        run: >-
          python validation/check-explorer.py
          --output-dir "$RUNNER_TEMP/report-browser-results"
          --axe-path "$RUNNER_TEMP/report-browser-tools/node_modules/axe-core/axe.min.js"
      - name: Require rejection of disconnected controls and false graphics
        run: >-
          python validation/check-report-mutations.py
          --output-dir "$RUNNER_TEMP/report-browser-results/mutations"
          --axe-path "$RUNNER_TEMP/report-browser-tools/node_modules/axe-core/axe.min.js"
      - name: Verify prediction decisions against original R predictions
        run: >-
          python validation/check-predictions.py
          --case-dir /tmp/autoxplain-explorer-cases
          --output-dir "$RUNNER_TEMP/report-browser-results/predictions"
          --axe-path "$RUNNER_TEMP/report-browser-tools/node_modules/axe-core/axe.min.js"
      - name: Verify data exploration against original source records
        run: >-
          python validation/check-data-explorer.py
          --case-dir /tmp/autoxplain-explorer-cases
          --output-dir "$RUNNER_TEMP/report-browser-results/data"
          --axe-path "$RUNNER_TEMP/report-browser-tools/node_modules/axe-core/axe.min.js"
      - name: Verify linked mistakes and R code follow the selected cutoff
        run: >-
          python validation/check-cutoff-cases.py
          --case-dir /tmp/autoxplain-explorer-cases
          --output-dir "$RUNNER_TEMP/report-browser-results/cutoff-cases"
      - name: Verify selection decisions and fold charts
        run: >-
          python validation/check-selection.py
          --output-dir "$RUNNER_TEMP/report-browser-results/selection"
      - name: Verify supplied-model reports and repeated prediction costs
        run: >-
          python validation/check-supplied-models.py
          --case-dir /tmp/autoxplain-explorer-cases
          --output-dir "$RUNNER_TEMP/report-browser-results/supplied-models"
          --axe-path "$RUNNER_TEMP/report-browser-tools/node_modules/axe-core/axe.min.js"
      - name: Upload compact browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AutoXplainR-report-browser-${{ github.sha }}
          path: ${{ runner.temp }}/report-browser-results/
          if-no-files-found: warn
          retention-days: 7
