on:
  push:
    branches: [main]
    paths:
      - 'R/**'
      - 'src/**'
      - 'inst/**'
      - 'data/**'
      - 'tests/**'
      - 'man/*.Rd'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.Rprofile'
      - '.Rinstignore'
      - '.covrignore'
      - 'configure'
      - 'configure.win'
      - 'cleanup'
      - 'cleanup.win'
      - '.github/workflows/test-coverage.yaml'
  pull_request:
    paths:
      - 'R/**'
      - 'src/**'
      - 'inst/**'
      - 'data/**'
      - 'tests/**'
      - 'man/*.Rd'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.Rprofile'
      - '.Rinstignore'
      - '.covrignore'
      - 'configure'
      - 'configure.win'
      - 'cleanup'
      - 'cleanup.win'
      - '.github/workflows/test-coverage.yaml'
  workflow_dispatch:

name: test-coverage

permissions:
  contents: read

concurrency:
  group: test-coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      AUTOXPLAIN_RUN_H2O: false
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::covr, any::testthat, any::plotly
          needs: coverage
      - name: Test coverage
        run: |
          coverage <- covr::package_coverage(quiet = FALSE)
          print(coverage)
          percentage <- covr::percent_coverage(coverage)
          message(sprintf("Measured package coverage: %.2f%%", percentage))
          summary_file <- Sys.getenv("GITHUB_STEP_SUMMARY", unset = "")
          if (nzchar(summary_file)) {
            writeLines(
              c("## Test coverage", "", sprintf("**%.2f%%** statement coverage", percentage)),
              summary_file
            )
          }
          if (percentage < 80) {
            stop(sprintf("Coverage %.2f%% is below the required 80%%.", percentage))
          }
        shell: Rscript {0}
