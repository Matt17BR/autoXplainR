name: Method or feature proposal
description: Propose a workflow improvement, statistical method, or adapter
title: "[Proposal]: "
labels: [enhancement, design]
body:
  - type: textarea
    id: claim
    attributes:
      label: User task and expected result
      description: What concrete question or task is difficult now? What would the user be able to do?
    validations:
      required: true
  - type: textarea
    id: estimand
    attributes:
      label: Assumptions and limits
      description: For statistical changes, define the target quantity and assumptions. For workflow changes, describe the data, users and failure cases that matter.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Describe a task or independent calculation that would verify the result, and a wrong result it should reject. Add method references or simulations when applicable.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Proposed API and output contract
    validations:
      required: true
